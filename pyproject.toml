[project]
name = "eqsl-mcp"
version = "0.3.8"
description = "MCP server for eQSL.cc — inbox download, QSO verification, AG status checks"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.10"
dependencies = [
    "qso-graph-auth>=0.1.1",
    "fastmcp>=4.0,<5",
    "certifi",
]
keywords = [
    "amateur-radio", "ham-radio", "eqsl", "qsl", "qso",
    "mcp", "model-context-protocol", "confirmation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/eqsl/"
Repository = "https://github.com/qso-graph/eqsl-mcp"
Issues = "https://github.com/qso-graph/eqsl-mcp/issues"

[project.scripts]
eqsl-mcp = "eqsl_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eqsl_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it was deferred here while the rules that find defects
# went in first (qso-graph-devel#70). That pass has now happened for this repo
# (#22) and reported **nothing**: this source was already within 95 columns, so
# adopting it was the config change alone, with no reflow.
#
# That it is enforced rather than inert was checked, not assumed — a planted
# 117-character line is reported. No line here needs an exemption; where one
# would, the length is the correctness (a publisher's field name, or a wire
# format whose shape is the point) and it carries a `# noqa: E501` with the
# reason, or lives in a file of its own as lotw-mcp's ADIF samples do.
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
